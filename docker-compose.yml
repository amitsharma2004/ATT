services:
  stt-pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stt-voice-pipeline
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - DEVICE=cuda
      - DIARIZATION_DEVICE=cuda
      # HuggingFace & Torch cache locations inside container
      - HF_HOME=/root/.cache/huggingface
      - TORCH_HOME=/root/.cache/torch
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      # Persistent voice registry, processed audio, and transcripts
      - ./storage:/app/storage
      - hf_cache:/root/.cache/huggingface
      - torch_cache:/root/.cache/torch

volumes:
  hf_cache:
    name: stt_hf_cache
  torch_cache:
    name: stt_torch_cache
